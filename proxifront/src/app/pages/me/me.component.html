<mat-card>
  <mat-card-header>
    <mat-card-title>Mon profil</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (loading()) {
      <p>Chargement...</p>
    } @else if (errorMessage()) {
      <p class="server-error">{{ errorMessage() }}</p>
    } @else if (user(); as currentUser) {
      <dl>
        <dt>Nom</dt>
        <dd>{{ currentUser.display_name }}</dd>

        <dt>Email</dt>
        <dd>{{ currentUser.email }}</dd>
      </dl>
    }

    <button matButton="outlined" class="mat-button-tertiary" (click)="logout()">Se déconnecter</button>
  </mat-card-content>
</mat-card>
