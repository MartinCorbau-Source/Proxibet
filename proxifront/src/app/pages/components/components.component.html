<h1>Angular Material — Composants</h1>

<mat-card>
  <mat-card-header>
    <mat-card-title>Boutons</mat-card-title>
  </mat-card-header>
  <mat-card-content class="row">
    <button matButton>Basic</button>
    <button matButton="filled">Filled</button>
    <button matButton="outlined">Outlined</button>
    <button matButton="tonal">Tonal</button>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Champ de formulaire</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field>
      <mat-label>Nom</mat-label>
      <input matInput placeholder="Entrez votre nom" />
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Checkbox &amp; Slide Toggle</mat-card-title>
  </mat-card-header>
  <mat-card-content class="row">
    <mat-checkbox>J'accepte les conditions</mat-checkbox>
    <mat-slide-toggle>Activer</mat-slide-toggle>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Slider</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-slider min="0" max="100" step="1" discrete>
      <input matSliderThumb value="50" />
    </mat-slider>
  </mat-card-content>
</mat-card>
